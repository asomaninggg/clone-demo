<!doctype html>
<html><head><meta charset="utf-8"><title>KOFI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet"><style>
html,body{margin:0;height:100%;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;background:radial-gradient(ellipse at center,#16161d 0%,#050507 70%)}
#intro{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:16vw;font-weight:800;margin:0;letter-spacing:.08em;background:linear-gradient(180deg,#fff,#8a8aa0);-webkit-background-clip:text;color:transparent}
.sub{font-weight:300;opacity:.75;font-size:1.25rem;margin:.5rem 0}.by{font-size:.85rem;opacity:.45}
button{font:500 1rem Inter,sans-serif;padding:.9rem 2.2rem;border:1px solid #fff3;background:#ffffff0d;color:#fff;border-radius:999px;cursor:pointer;transition:.2s}
button:hover{background:#fff;color:#000}#go{margin-top:2.5rem}
.badge{position:fixed;top:20px;z-index:3;padding:6px 14px;border-radius:6px;font:600 .85rem Inter,sans-serif;letter-spacing:.08em}
#live{right:20px;background:#e11d48}#live.on{animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35}}
#timer{right:96px;background:#0009;display:none;font-variant-numeric:tabular-nums}
#end{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:3;display:none;border-color:#e11d48;background:#e11d48}
#msg{margin-top:1rem;min-height:1.4em;opacity:.8}#msg.err{color:#f87171;opacity:1}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
#outro{height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fade 1s ease}
@keyframes fade{from{opacity:0}}#outro h2{font-size:1.9rem;font-weight:600;margin:0}.night{opacity:.6;font-weight:300;margin:.4rem 0 1.4rem}.stats{margin-top:1rem}
.stats{opacity:.6;font-size:.95rem}#qr{margin:1.6rem auto .4rem;padding:10px;background:#fff;border-radius:10px}
.scan{font-size:.8rem;opacity:.55}.foot{font-style:italic;opacity:.5;margin-top:1.4rem}#restart{color:#fff8;font-size:.8rem;margin-top:.8rem}
.meme{position:relative;width:260px}.meme video{width:100%;border-radius:14px;box-shadow:0 10px 40px #0008;display:block}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<div id="live" class="badge">LIVE</div><div id="timer" class="badge">00:00</div>
<div id="intro"><h1>KOFI</h1><div class="sub">AI Cofounder · Built without Tested. Would be funny if it worked</div>
<div class="by">by Lloyd</div><button id="go">Bring out Kofi</button><div id="msg"></div></div>
<div id="outro"><h2>Thanks for spending the evening with Kofi.</h2><div class="night">Goodnight, Accra 🌙</div><div class="meme"><video src="battle-cat.mp4" autoplay muted loop playsinline></video></div><div class="stats">Call duration: <span id="dur">00:00</span></div>
<div id="qr"></div><div class="scan">Scan to connect on LinkedIn</div><div class="foot">Lloyd had the idea. AI did everything.</div>
<a href="#" id="restart">Restart (R)</a></div>
<iframe id="stage" allow="camera; microphone; autoplay; fullscreen"></iframe><button id="end">End call (E)</button>
<script>
const OUTRO_URL = "https://www.linkedin.com/in/emmanuel-asomaning-ntim/";
let convId = null, tick = null;
new QRCode(qr, { text: OUTRO_URL, width: 140, height: 140 });
const showOutro = () => { outro.querySelector('video').play(); dur.textContent = timer.textContent; intro.style.display = 'none'; outro.style.display = 'flex'; };
const goIntro = () => { outro.style.display = 'none'; intro.style.display = 'flex'; timer.textContent = '00:00'; show(''); };
document.getElementById('restart').onclick = e => { e.preventDefault(); goIntro(); };
const show = (t, isErr) => { msg.textContent = t; msg.className = isErr ? 'err' : ''; };
go.onclick = async () => {
  go.disabled = true; show('Waking Kofi up...');
  try {
    const r = await fetch('/start', { method: 'POST' });
    const d = await r.json();
    if (!r.ok || !d.conversation_url) throw new Error(d.message || d.error || 'Could not start conversation');
    convId = d.conversation_id;
    stage.onload = () => {
      intro.style.display = 'none'; stage.style.display = end.style.display = timer.style.display = 'block';
      live.classList.add('on'); const t0 = Date.now();
      tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000);
        timer.textContent = String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
    };
    stage.src = d.conversation_url;
  } catch (e) { show('Error: ' + e.message, true); go.disabled = false; }
};
async function endCall() {
  if (!convId) return;
  const id = convId; convId = null; clearInterval(tick);
  stage.onload = null; stage.src = 'about:blank'; stage.style.display = end.style.display = timer.style.display = 'none';
  live.classList.remove('on'); go.disabled = false; showOutro();
  try { const r = await fetch('/end/' + id, { method: 'POST' }); if (!r.ok) show('Call closed, but Tavus did not confirm the end.', true); }
  catch (e) { show('Error ending call: ' + e.message, true); }
}
end.onclick = endCall;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'e') endCall();
  if (k === 'r' && outro.style.display === 'flex') goIntro();
  if (k === 'o' && intro.style.display !== 'none' && !convId) showOutro();
});
</script></body></html>
